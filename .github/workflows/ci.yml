name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux is the platform the project is developed and verified on. Windows and macOS are run so problems show up, but they do not block
    # a merge yet: make them required (delete this line) once they have been green for a while.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pull request agent (scripts/pr-agent) has its own small set of dependencies; its tests import them.
      - run: npm ci --prefix scripts/pr-agent --ignore-scripts
      # The generated PHP client is checked with a real PHP. Linux and Windows runners ship one; macOS runners do not.
      - name: Install PHP (macOS)
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # Unit, security and integration tests. They check the exporters with real compilers (tsc, python, javac) and need no browser.
      - run: npm test

  package:
    name: install package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Packs the program and the extensions, installs the tarball into a clean folder the way a new user would, starts the server and
      # checks /health and that /status needs the token. The same script runs on every system.
      - run: npm run release
      - run: node scripts/smoke-install.mjs release
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: browserforge-package
          path: |
            release/*.tgz
            artifacts/*.zip

  # Real Chromium with the extension loaded. Started by hand (Actions > CI > Run workflow): it needs a browser download and takes a few minutes.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          BF_BROWSERS: chromium
